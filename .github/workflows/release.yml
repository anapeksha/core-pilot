name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in verification artifacts
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  web:
    name: Build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  firmware:
    name: Sign and package firmware
    needs: web
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dist
      - name: Derive version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          idf.py -C firmware/s3 -B firmware/s3/build -D PROJECT_VER="${VERSION}" build
      - name: Sign and verify application
        shell: bash
        working-directory: firmware/s3
        env:
          SIGNING_KEY: ${{ secrets.ESP_FIRMWARE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          set +x
          test -n "${SIGNING_KEY}"
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${SIGNING_KEY}" > "${key_file}"
          mv build/core_pilot.bin build/core_pilot-unsigned.bin
          espsecure.py sign_data --version 2 \
            --keyfile "${key_file}" \
            --output build/core_pilot.bin \
            build/core_pilot-unsigned.bin
          espsecure.py verify_signature --version 2 \
            --keyfile "${key_file}" \
            build/core_pilot.bin
          rm build/core_pilot-unsigned.bin
      - name: Package release
        shell: bash
        working-directory: firmware/s3
        run: |
          set -euo pipefail
          mkdir -p release
          initial="release/core-pilot-${VERSION}.bin"
          ota="release/core-pilot-${VERSION}-ota.bin"
          python -m esptool --chip esp32s3 merge-bin \
            --flash-mode qio \
            --flash-freq 80m \
            --flash-size 16MB \
            --output "${initial}" \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xf000 build/ota_data_initial.bin \
            0x20000 build/core_pilot.bin
          cp build/core_pilot.bin "${ota}"
          cd release
          checksums="core-pilot-${VERSION}-SHA256SUMS"
          sha256sum "core-pilot-${VERSION}.bin" \
            "core-pilot-${VERSION}-ota.bin" > "${checksums}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            firmware/s3/release/core-pilot-${{ env.VERSION }}.bin
            firmware/s3/release/core-pilot-${{ env.VERSION }}-ota.bin
            firmware/s3/release/core-pilot-${{ env.VERSION }}-SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    if: github.event_name == 'release'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release/core-pilot-*.bin
            release/core-pilot-*-SHA256SUMS
