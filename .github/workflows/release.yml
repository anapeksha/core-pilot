name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  firmware:
    name: Sign and package firmware
    needs: web
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dist
      - name: Derive version from tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"
      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          idf.py -C firmware -B firmware/build -D PROJECT_VER="${VERSION}" build
      - name: Sign and verify application
        shell: bash
        working-directory: firmware
        env:
          SIGNING_KEY: ${{ secrets.ESP_FIRMWARE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          set +x
          test -n "${SIGNING_KEY}"
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${SIGNING_KEY}" > "${key_file}"
          mv build/core_pilot.bin build/core_pilot-unsigned.bin
          espsecure.py sign_data --version 2 \
            --keyfile "${key_file}" \
            --output build/core_pilot.bin \
            build/core_pilot-unsigned.bin
          espsecure.py verify_signature --version 2 \
            --keyfile "${key_file}" \
            build/core_pilot.bin
          rm build/core_pilot-unsigned.bin
      - name: Package release
        shell: bash
        working-directory: firmware
        run: |
          set -euo pipefail
          package="release/core-pilot-${VERSION}"
          mkdir -p "${package}/bootloader" "${package}/partition_table"
          cp build/bootloader/bootloader.bin "${package}/bootloader/"
          cp build/partition_table/partition-table.bin "${package}/partition_table/"
          cp build/ota_data_initial.bin build/core_pilot.bin \
            build/flash_args build/flasher_args.json build/project_description.json \
            "${package}/"
          cp build/core_pilot.bin "release/core-pilot-${VERSION}-ota.bin"
          tar -C release -czf "release/core-pilot-${VERSION}-initial-flash.tar.gz" \
            "core-pilot-${VERSION}"
          cd release
          sha256sum "core-pilot-${VERSION}-ota.bin" \
            "core-pilot-${VERSION}-initial-flash.tar.gz" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            firmware/release/core-pilot-${{ env.VERSION }}-ota.bin
            firmware/release/core-pilot-${{ env.VERSION }}-initial-flash.tar.gz
            firmware/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/core-pilot-*-ota.bin
            release/core-pilot-*-initial-flash.tar.gz
            release/SHA256SUMS
