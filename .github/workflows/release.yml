name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  web:
    name: Build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  firmware:
    name: Sign and package firmware
    needs: web
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dashboard-dist
          path: dist
      - name: Derive version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=${RELEASE_TAG#v}" >> "${GITHUB_ENV}"
      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          idf.py -C firmware/s3 -B firmware/s3/build -D PROJECT_VER="${VERSION}" build
      - name: Sign and verify application
        shell: bash
        working-directory: firmware/s3
        env:
          SIGNING_KEY: ${{ secrets.ESP_FIRMWARE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          set +x
          test -n "${SIGNING_KEY}"
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${SIGNING_KEY}" > "${key_file}"
          mv build/core_pilot.bin build/core_pilot-unsigned.bin
          espsecure.py sign_data --version 2 \
            --keyfile "${key_file}" \
            --output build/core_pilot.bin \
            build/core_pilot-unsigned.bin
          espsecure.py verify_signature --version 2 \
            --keyfile "${key_file}" \
            build/core_pilot.bin
          rm build/core_pilot-unsigned.bin
      - name: Package release
        shell: bash
        working-directory: firmware/s3
        run: |
          set -euo pipefail
          mkdir -p release
          initial="release/core-pilot-${VERSION}.bin"
          ota="release/core-pilot-${VERSION}-ota.bin"
          python -m esptool --chip esp32s3 merge-bin \
            --flash-mode qio \
            --flash-freq 80m \
            --flash-size 16MB \
            --output "${initial}" \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xf000 build/ota_data_initial.bin \
            0x20000 build/core_pilot.bin
          cp build/core_pilot.bin "${ota}"
          cd release
          checksums="core-pilot-${VERSION}-SHA256SUMS"
          sha256sum "core-pilot-${VERSION}.bin" \
            "core-pilot-${VERSION}-ota.bin" > "${checksums}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            firmware/s3/release/core-pilot-${{ env.VERSION }}.bin
            firmware/s3/release/core-pilot-${{ env.VERSION }}-ota.bin
            firmware/s3/release/core-pilot-${{ env.VERSION }}-SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release/core-pilot-*.bin
            release/core-pilot-*-SHA256SUMS
