name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run test:browser
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  firmware:
    name: ESP-IDF C++ firmware
    runs-on: ubuntu-latest
    needs: web
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dist
      - name: Install ESP-Clang
        run: python "$IDF_PATH/tools/idf_tools.py" install esp-clang
      - name: Check C++ formatting
        run: python tools/format.py
      - name: Configure isolated ESP-Clang compilation database
        run: >-
          idf.py -C firmware/s3 -B firmware/s3/build-clang
          -D IDF_TOOLCHAIN=clang
          -D SDKCONFIG=sdkconfig.clang
          -D SDKCONFIG_DEFAULTS=sdkconfig.defaults
          reconfigure
      - name: Run clang-tidy
        run: python tools/lint.py build-clang
      - name: Build firmware
        run: idf.py -C firmware/s3 -B firmware/s3/build build

  required:
    name: required
    if: always()
    needs: [web, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        if: needs.web.result != 'success' || needs.firmware.result != 'success'
        run: exit 1
      - run: echo "All required Core Pilot checks passed."
