name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run test:browser
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: web/dist
          if-no-files-found: error

  firmware:
    name: ESP-IDF C++ firmware
    runs-on: ubuntu-latest
    needs: web
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dist
      - name: Install C++ analysis tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends clang-format
          python "$IDF_PATH/tools/idf_tools.py" install esp-clang
      - name: Check C++ formatting
        run: python tools/format.py
      - name: Build firmware
        working-directory: firmware
        run: idf.py build
      - name: Configure ESP-Clang compilation database
        working-directory: firmware
        run: idf.py -B build-clang -D IDF_TOOLCHAIN=clang reconfigure
      - name: Run clang-tidy
        run: python tools/lint.py build-clang
      - uses: actions/upload-artifact@v4
        with:
          name: core-pilot-firmware
          path: |
            firmware/build/core_pilot.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          if-no-files-found: error

  required:
    name: required
    if: always()
    needs: [web, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        if: needs.web.result != 'success' || needs.firmware.result != 'success'
        run: exit 1
      - run: echo "All required Core Pilot checks passed."
