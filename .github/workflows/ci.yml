name: ci

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py' -v

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - run: npm run format
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run test:coverage
      - run: npm run test:browser
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  host_tests:
    name: Native portable logic execution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v7
      - name: Export ESP-IDF environment
        run: |
          . "$IDF_PATH/export.sh"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Configure native host tests
        run: cmake -S firmware/s3/test/host -B firmware/s3/test/host/build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build native host tests
        run: cmake --build firmware/s3/test/host/build
      - name: Execute native host tests
        run: ctest --test-dir firmware/s3/test/host/build --output-on-failure

  esp32s3_test_image:
    name: ESP32-S3 Unity test image (compile/link only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v7
      - name: Export ESP-IDF environment
        run: |
          . "$IDF_PATH/export.sh"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "ESP_IDF_VERSION=$ESP_IDF_VERSION" >> "$GITHUB_ENV"
          echo "IDF_PYTHON_ENV_PATH=$IDF_PYTHON_ENV_PATH" >> "$GITHUB_ENV"
      - name: Configure ESP32-S3 Unity test image
        run: >-
          idf.py -C firmware/s3/test/esp32s3
          -B firmware/s3/test/esp32s3/build
          -D SDKCONFIG_DEFAULTS=sdkconfig.defaults
          set-target esp32s3
      - name: Compile and link ESP32-S3 Unity test image
        run: >-
          idf.py -C firmware/s3/test/esp32s3
          -B firmware/s3/test/esp32s3/build build

  firmware:
    name: ESP-IDF C++ firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: web
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: dist
      - name: Install ESP-Clang
        run: |
          python "$IDF_PATH/tools/idf_tools.py" install esp-clang
          . "$IDF_PATH/export.sh"
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          echo "ESP_IDF_VERSION=$ESP_IDF_VERSION" >> "$GITHUB_ENV"
          echo "IDF_PYTHON_ENV_PATH=$IDF_PYTHON_ENV_PATH" >> "$GITHUB_ENV"
      - name: Check C++ formatting
        run: python tools/format.py
      - name: Configure isolated ESP-Clang compilation database
        run: >-
          idf.py -C firmware/s3 -B firmware/s3/build-clang
          -D IDF_TOOLCHAIN=clang
          -D SDKCONFIG=sdkconfig.clang
          -D SDKCONFIG_DEFAULTS=sdkconfig.defaults
          reconfigure
      - name: Run clang-tidy
        run: python tools/lint.py build-clang
      - name: Build firmware
        run: idf.py -C firmware/s3 -B firmware/s3/build build
      - name: Enforce firmware release budget
        run: >-
          python tools/release.py inspect-build
          --build-dir firmware/s3/build
          --partitions firmware/s3/partitions.csv

  required:
    name: required
    if: always()
    needs: [python, web, host_tests, esp32s3_test_image, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        if: >-
          needs.python.result != 'success' ||
          needs.web.result != 'success' ||
          needs.host_tests.result != 'success' ||
          needs.esp32s3_test_image.result != 'success' ||
          needs.firmware.result != 'success'
        run: exit 1
      - run: echo "All required Core Pilot checks passed."
